# pnpm 11+ (lokální dev) používá allowBuilds
allowBuilds:
  '@swc/core': true
  better-sqlite3: true
  core-js-pure: true
  esbuild: true
  sharp: true

# pnpm 10 (CI, viz .github/workflows/verify.yml) používá onlyBuiltDependencies
onlyBuiltDependencies:
  - '@swc/core'
  - better-sqlite3
  - core-js-pure
  - esbuild
  - sharp
